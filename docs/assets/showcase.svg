<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#090a10"/>
      <stop offset="100%" stop-color="#040406"/>
    </linearGradient>

    <!-- Subtle Ambient Glows -->
    <radialGradient id="glowSvelte" cx="15%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#FF3E00" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF3E00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="85%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Fill & Border Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3e4a" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#23252d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3b3e4a" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Header Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3E00"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowSvelte)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#glowViolet)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.02" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="535" x2="1200" y2="535"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- ================= TOP HEADER ================= -->
  <g class="font-sans" transform="translate(60, 42)">
    <!-- Brand Logo Pill -->
    <rect x="0" y="0" width="170" height="30" rx="15" fill="#1c1d24" stroke="#2e303b" stroke-width="1"/>
    <circle cx="16" cy="15" r="5" fill="#FF3E00"/>
    <text x="28" y="20" fill="#FFFFFF" font-size="12" font-weight="700" letter-spacing="1">NIDO EDGE CMS</text>

    <!-- Main Title & Tagline -->
    <text x="0" y="68" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="-0.5">Ultra-fast · Minimalist · Edge-native Content Engine</text>
    
    <!-- Top Right Tech Pills -->
    <g transform="translate(660, 0)">
      <!-- Pill 1: Svelte 5 -->
      <rect x="0" y="4" width="105" height="26" rx="13" fill="#1a1215" stroke="#FF3E00" stroke-opacity="0.4" stroke-width="1"/>
      <text x="52" y="21" fill="#FF7A50" font-size="11" font-weight="600" text-anchor="middle">Svelte 5 Runes</text>

      <!-- Pill 2: Tailwind 4 -->
      <rect x="115" y="4" width="95" height="26" rx="13" fill="#0c171d" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1"/>
      <text x="162" y="21" fill="#38BDF8" font-size="11" font-weight="600" text-anchor="middle">Tailwind v4</text>

      <!-- Pill 3: Cloudflare Edge -->
      <rect x="220" y="4" width="100" height="26" rx="13" fill="#1b160e" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
      <text x="270" y="21" fill="#FBBF24" font-size="11" font-weight="600" text-anchor="middle">Edge Routing</text>

      <!-- Pill 4: AGPL 3.0 -->
      <rect x="330" y="4" width="90" height="26" rx="13" fill="#101815" stroke="#10B981" stroke-opacity="0.4" stroke-width="1"/>
      <text x="375" y="21" fill="#34D399" font-size="11" font-weight="600" text-anchor="middle">AGPL-3.0</text>
    </g>
  </g>

  <!-- ================= DUAL MOCKUP WINDOWS ================= -->
  
  <!-- LEFT WINDOW: PUBLIC SITE (Apple OLED Minimalist) -->
  <g class="font-sans" transform="translate(60, 140)">
    <!-- Window Outer Shell -->
    <rect x="0" y="0" width="515" height="365" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Window Topbar -->
    <rect x="0" y="0" width="515" height="42" rx="18" fill="#181920"/>
    <rect x="0" y="22" width="515" height="20" fill="#181920"/>
    <line x1="0" y1="42" x2="515" y2="42" stroke="#252732" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
    <circle cx="36" cy="21" r="5.5" fill="#FFBD2E"/>
    <circle cx="52" cy="21" r="5.5" fill="#27C93F"/>

    <!-- URL Bar -->
    <rect x="130" y="10" width="255" height="22" rx="6" fill="#0d0e12" stroke="#252732" stroke-width="1"/>
    <text x="257" y="25" fill="#8E92A0" font-size="10.5" font-weight="500" text-anchor="middle" class="font-mono">https://docs.mybrand.edge</text>

    <!-- Public Site Content Area -->
    <g transform="translate(26, 62)">
      <!-- Category Pill -->
      <rect x="0" y="0" width="86" height="20" rx="10" fill="#FF3E00" fill-opacity="0.15" stroke="#FF3E00" stroke-opacity="0.3" stroke-width="0.8"/>
      <text x="43" y="14" fill="#FF7A50" font-size="10" font-weight="700" text-anchor="middle">DOCUMENTATION</text>

      <!-- Headline -->
      <text x="0" y="44" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="-0.3">Fast. Minimalist. Edge-native.</text>
      <text x="0" y="66" fill="#9CA3AF" font-size="12" font-weight="400">Instant-loading publishing engine running at global edge locations.</text>

      <!-- 4 Theme Presets Switcher -->
      <g transform="translate(0, 88)">
        <text x="0" y="11" fill="#6B7280" font-size="10" font-weight="600" letter-spacing="0.5">THEMES:</text>
        <!-- Apple OLED Active Pill -->
        <rect x="60" y="-3" width="90" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
        <circle cx="72" cy="8" r="3.5" fill="#38BDF8"/>
        <text x="82" y="12" fill="#FFFFFF" font-size="10" font-weight="600">Apple OLED</text>

        <!-- Academic Warm Pill -->
        <rect x="156" y="-3" width="85" height="22" rx="11" fill="#181920" stroke="#282a35" stroke-width="1"/>
        <circle cx="168" cy="8" r="3.5" fill="#FBBF24"/>
        <text x="178" y="12" fill="#9CA3AF" font-size="10" font-weight="500">Academic</text>

        <!-- Executive Navy Pill -->
        <rect x="247" y="-3" width="85" height="22" rx="11" fill="#181920" stroke="#282a35" stroke-width="1"/>
        <circle cx="259" cy="8" r="3.5" fill="#60A5FA"/>
        <text x="269" y="12" fill="#9CA3AF" font-size="10" font-weight="500">Executive</text>

        <!-- Wellness Mint Pill -->
        <rect x="338" y="-3" width="85" height="22" rx="11" fill="#181920" stroke="#282a35" stroke-width="1"/>
        <circle cx="350" cy="8" r="3.5" fill="#34D399"/>
        <text x="360" y="12" fill="#9CA3AF" font-size="10" font-weight="500">Wellness</text>
      </g>

      <!-- Content Article Card -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="463" height="152" rx="12" fill="#0a0b0e" stroke="#23252d" stroke-width="1"/>
        
        <text x="18" y="28" fill="#F3F4F6" font-size="13" font-weight="700">Zero-Cold-Start Architecture</text>
        <text x="18" y="50" fill="#9CA3AF" font-size="11.5" line-height="16">
          <tspan x="18" dy="0">Requests are intercepted at the Edge layer via Cloudflare Pages.</tspan>
          <tspan x="18" dy="18">Multi-tenancy matches incoming domains with zero database latency.</tspan>
        </text>

        <!-- Mini Code / Metrics Preview -->
        <rect x="18" y="88" width="427" height="46" rx="8" fill="#14151b" stroke="#252733" stroke-width="0.8"/>
        <text x="32" y="106" fill="#38BDF8" font-size="10" class="font-mono">$ curl -I https://docs.mybrand.edge</text>
        <text x="32" y="122" fill="#10B981" font-size="10" class="font-mono">HTTP/2 200 OK · cf-cache-status: HIT · ttfb: 24ms</text>
      </g>
    </g>
  </g>

  <!-- RIGHT WINDOW: ADMIN CMS STUDIO (Tiptap & Edge Multi-tenant) -->
  <g class="font-sans" transform="translate(625, 140)">
    <!-- Window Outer Shell -->
    <rect x="0" y="0" width="515" height="365" rx="18" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.2"/>

    <!-- Window Topbar -->
    <rect x="0" y="0" width="515" height="42" rx="18" fill="#181920"/>
    <rect x="0" y="22" width="515" height="20" fill="#181920"/>
    <line x1="0" y1="42" x2="515" y2="42" stroke="#252732" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="20" cy="21" r="5.5" fill="#FF5F56"/>
    <circle cx="36" cy="21" r="5.5" fill="#FFBD2E"/>
    <circle cx="52" cy="21" r="5.5" fill="#27C93F"/>

    <!-- URL Bar -->
    <rect x="130" y="10" width="255" height="22" rx="6" fill="#0d0e12" stroke="#252732" stroke-width="1"/>
    <text x="257" y="25" fill="#8E92A0" font-size="10.5" font-weight="500" text-anchor="middle" class="font-mono">https://docs.mybrand.edge/admin</text>

    <!-- Admin Content Area -->
    <g transform="translate(0, 42)">
      <!-- Mini Left Sidebar -->
      <rect x="0" y="0" width="135" height="323" rx="0" fill="#101116"/>
      <line x1="135" y1="0" x2="135" y2="323" stroke="#20222a" stroke-width="1"/>

      <!-- Sidebar Items -->
      <g transform="translate(14, 18)">
        <!-- Section: Content -->
        <text x="0" y="8" fill="#6B7280" font-size="9" font-weight="700" letter-spacing="0.5">CONTENT</text>

        <!-- Active Item: Posts -->
        <rect x="-6" y="16" width="118" height="26" rx="6" fill="#FF3E00" fill-opacity="0.12" stroke="#FF3E00" stroke-opacity="0.25" stroke-width="0.8"/>
        <text x="8" y="33" fill="#FF7A50" font-size="11" font-weight="600">📝 Posts (14)</text>

        <text x="8" y="65" fill="#9CA3AF" font-size="11" font-weight="500">📁 Projects (6)</text>
        <text x="8" y="93" fill="#9CA3AF" font-size="11" font-weight="500">🎬 Videos (4)</text>

        <!-- Section: Operations -->
        <text x="0" y="130" fill="#6B7280" font-size="9" font-weight="700" letter-spacing="0.5">OPERATIONS</text>
        <text x="8" y="152" fill="#9CA3AF" font-size="11" font-weight="500">👥 Leads (3)</text>
        <text x="8" y="180" fill="#9CA3AF" font-size="11" font-weight="500">🌐 Tenants</text>
        <text x="8" y="208" fill="#9CA3AF" font-size="11" font-weight="500">⚙️ Settings</text>

        <!-- Edge Status Badge -->
        <g transform="translate(-4, 250)">
          <rect x="0" y="0" width="115" height="28" rx="6" fill="#0d1f14" stroke="#10B981" stroke-opacity="0.4" stroke-width="0.8"/>
          <circle cx="12" cy="14" r="3.5" fill="#10B981"/>
          <text x="22" y="18" fill="#34D399" font-size="9.5" font-weight="600">Edge Live · PoW</text>
        </g>
      </g>

      <!-- Main Editor Studio Canvas -->
      <g transform="translate(150, 16)">
        <!-- Editor Header with Save Button -->
        <text x="0" y="16" fill="#FFFFFF" font-size="15" font-weight="700">Edit Post: Welcome to Edge</text>
        <rect x="270" y="0" width="75" height="24" rx="6" fill="#FF3E00"/>
        <text x="307" y="16" fill="#FFFFFF" font-size="10.5" font-weight="700" text-anchor="middle">Publish</text>

        <!-- WYSIWYG Formatting Toolbar -->
        <rect x="0" y="32" width="345" height="26" rx="6" fill="#181920" stroke="#252732" stroke-width="1"/>
        <g transform="translate(10, 49)" fill="#9CA3AF" font-size="10.5" font-weight="600">
          <text x="0" y="0">B</text>
          <text x="18" y="0" font-style="italic">I</text>
          <text x="36" y="0">H1</text>
          <text x="58" y="0">H2</text>
          <text x="82" y="0" class="font-mono">&lt;/&gt;</text>
          <text x="110" y="0">Link</text>
          <text x="144" y="0">Image</text>
          <text x="188" y="0">Table</text>
        </g>

        <!-- Editor Writing Body -->
        <rect x="0" y="66" width="345" height="216" rx="8" fill="#0d0e12" stroke="#20222b" stroke-width="1"/>
        
        <g transform="translate(16, 92)">
          <text x="0" y="0" fill="#38BDF8" font-size="13" font-weight="700"># Getting Started with Svelte 5</text>
          
          <text x="0" y="24" fill="#E5E7EB" font-size="11.5" line-height="16">
            <tspan x="0" dy="0">Nido Edge CMS utilizes modern Runes:</tspan>
          </text>

          <!-- Code Snippet inside Editor -->
          <rect x="0" y="36" width="313" height="66" rx="6" fill="#13141a" stroke="#272935" stroke-width="0.8"/>
          <text x="12" y="54" fill="#F472B6" font-size="10" class="font-mono">let count = $state(0);</text>
          <text x="12" y="70" fill="#A78BFA" font-size="10" class="font-mono">let double = $derived(count * 2);</text>
          <text x="12" y="86" fill="#34D399" font-size="10" class="font-mono">// 100% Zero-VDOM Compilation</text>

          <!-- Auto-save Pill -->
          <g transform="translate(0, 118)">
            <circle cx="4" cy="5" r="3" fill="#10B981"/>
            <text x="12" y="8" fill="#9CA3AF" font-size="10">Saved to Git-backed content store</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM HIGHLIGHT METRICS BAR ================= -->
  <g class="font-sans" transform="translate(60, 532)">
    <rect x="0" y="0" width="1080" height="64" rx="14" fill="#0e0f14" stroke="#20222a" stroke-width="1"/>

    <!-- Metric 1: Performance -->
    <g transform="translate(35, 20)">
      <circle cx="12" cy="12" r="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1.2"/>
      <text x="12" y="16" fill="#34D399" font-size="10" font-weight="800" text-anchor="middle">100</text>
      <text x="34" y="12" fill="#FFFFFF" font-size="12" font-weight="700">Lighthouse 100/100</text>
      <text x="34" y="27" fill="#8E92A0" font-size="10">Zero-VDOM · Instant TTFB</text>
    </g>

    <line x1="285" y1="14" x2="285" y2="50" stroke="#252733" stroke-width="1"/>

    <!-- Metric 2: Multi-Tenancy -->
    <g transform="translate(315, 20)">
      <text x="0" y="12" fill="#38BDF8" font-size="14">🌐</text>
      <text x="24" y="12" fill="#FFFFFF" font-size="12" font-weight="700">Edge Multi-Tenant</text>
      <text x="24" y="27" fill="#8E92A0" font-size="10">1 Worker = Multi Domains</text>
    </g>

    <line x1="550" y1="14" x2="550" y2="50" stroke="#252733" stroke-width="1"/>

    <!-- Metric 3: Design System -->
    <g transform="translate(580, 20)">
      <text x="0" y="12" fill="#FBBF24" font-size="14">🎨</text>
      <text x="24" y="12" fill="#FFFFFF" font-size="12" font-weight="700">Apple SF Design</text>
      <text x="24" y="27" fill="#8E92A0" font-size="10">strokeWidth=1.75 · 4 Themes</text>
    </g>

    <line x1="815" y1="14" x2="815" y2="50" stroke="#252733" stroke-width="1"/>

    <!-- Metric 4: Security -->
    <g transform="translate(845, 20)">
      <text x="0" y="12" fill="#A78BFA" font-size="14">🛡️</text>
      <text x="24" y="12" fill="#FFFFFF" font-size="12" font-weight="700">Hardened Security</text>
      <text x="24" y="27" fill="#8E92A0" font-size="10">PBKDF2 · PoW · 0 Leaks</text>
    </g>
  </g>
</svg>